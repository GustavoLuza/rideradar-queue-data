name: Collect queue times

on:
  schedule:
    # deslocado 2min do minuto redondo (:00, :05, ...) -- GitHub avisa que
    # cron em horário "redondo" sofre mais fila/atraso por alta demanda
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect-queue-times
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect current wait times
        run: python3 collector/collect.py

      - name: Commit and push if data changed
        run: |
          git config user.name "rideradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "no changes to commit"
          fi
