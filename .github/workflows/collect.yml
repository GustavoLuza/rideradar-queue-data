name: Collect queue times

on:
  schedule:
    # deslocado 2min do minuto redondo (:00, :05, ...) -- GitHub avisa que
    # cron em horário "redondo" sofre mais fila/atraso por alta demanda
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect-queue-times
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect current wait times
        run: python3 collector/collect.py

      - name: Commit and push if data changed
        run: |
          git config user.name "rideradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            # checkout pode estar em SHA velho (ex: re-run de execução antiga) --
            # sincroniza com o main atual antes de empurrar, tentando algumas vezes
            # caso outra execução concorrente empurre ao mesmo tempo.
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "push falhou (tentativa $i), tentando de novo..."
              sleep 5
            done
          else
            echo "no changes to commit"
          fi
