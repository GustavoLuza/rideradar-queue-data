name: Collect queue times

on:
  # sem `schedule:` -- o disparo vem de um cron externo (cron-job.org) chamando
  # workflow_dispatch de 5 em 5 min, que e muito mais pontual que o cron nativo
  # do GitHub. Manter os dois ativos so gerava coleta duplicada. Ver secao 8 da
  # DOCUMENTACAO.md.
  workflow_dispatch: {}

permissions:
  contents: write

# sem bloco `concurrency`: o GitHub so mantem 1 run rodando + 1 na fila por
# grupo e mata o pendente quando chega um terceiro. Como o dispatch e fixo a
# cada 5 min, qualquer espera por runner acima disso virava cancelamento em
# cadeia -- em 06/08/2026 isso custou buracos de ate 2h no historico. As
# corridas de push entre runs simultaneos ja sao tratadas pelo retry com
# rebase abaixo.

jobs:
  collect:
    runs-on: ubuntu-latest
    # nenhum job travado deve segurar a coleta seguinte
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Collect current wait times
        run: python3 collector/collect.py

      - name: Commit and push if data changed
        run: |
          git config user.name "rideradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            # checkout pode estar em SHA velho (ex: re-run de execução antiga) --
            # sincroniza com o main atual antes de empurrar, tentando algumas vezes
            # caso outra execução concorrente empurre ao mesmo tempo.
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "push falhou (tentativa $i), tentando de novo..."
              sleep 5
            done
          else
            echo "no changes to commit"
          fi
